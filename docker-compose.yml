services:
  musicdl:
    image: ghcr.io/fightroad/musicdl:latest
    container_name: musicdl
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      # AUTH_PASSWORD: your-password    # optional, enable login gate
      # GITHUB_TOKEN: ghp_xxx          # optional, higher GitHub API rate limit
      # LX_BUNDLE_REPO: owner/repo     # optional, default guoyue2010/lxmusic-
    volumes:
      - ./data:/app/data
