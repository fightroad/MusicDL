<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MusicDL</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="page-home">
  <header class="top">
    <a class="brand" href="#search" data-view="search">
      <img class="brand-icon" src="/img/logo.svg" width="28" height="28" alt="" />
      <span>MusicDL</span>
    </a>
    <nav>
      <button type="button" id="dlQueueToggle" class="nav-link nav-queue" aria-expanded="false">
        <span class="nav-label-full">下载队列</span>
        <span class="nav-label-short">队列</span>
        <span id="dlQueueBadge" class="dl-queue-badge" hidden>0</span>
      </button>
      <a href="#search" data-view="search" class="nav-link">
        <span class="nav-label-full">音乐搜索</span>
        <span class="nav-label-short">搜索</span>
      </a>
      <a href="#downloads" data-view="downloads" class="nav-link">
        <span class="nav-label-full">音乐管理</span>
        <span class="nav-label-short">音乐</span>
      </a>
      <a href="#sources" data-view="sources" class="nav-link">
        <span class="nav-label-full">音源管理</span>
        <span class="nav-label-short">音源</span>
      </a>
      <button type="button" id="btnLogout" class="nav-link nav-logout" hidden>退出</button>
    </nav>
  </header>

  <main id="viewSearch" class="wrap view-panel" hidden>
    <section class="search-bar">
      <select id="sourceSelect"></select>
      <input id="keyword" type="search" enterkeyhint="search" placeholder="输入歌名 / 歌手" />
      <button id="btnSearch" type="button">搜索</button>
    </section>

    <div id="platformTabs" class="platform-tabs" hidden></div>

    <div class="results-shell">
      <div class="table-wrap">
        <table>
          <thead>
          <tr>
            <th class="col-idx">#</th>
            <th class="col-song">歌曲名</th>
            <th class="col-artist">艺术家</th>
            <th class="col-album">专辑名</th>
            <th class="col-duration">时长</th>
            <th class="col-actions">操作</th>
          </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <div id="pager" class="pager" hidden>
        <div class="pager-nav">
          <button type="button" id="btnPrev" class="ghost">上一页</button>
          <span id="pageInfo" class="page-info">1 / 1</span>
          <button type="button" id="btnNext" class="ghost">下一页</button>
        </div>
        <select id="pageSize" title="每页条数">
          <option value="20">20 条/页</option>
          <option value="30">30 条/页</option>
          <option value="50">50 条/页</option>
        </select>
      </div>
    </div>
  </main>
  <script>
    (() => {
      const h = location.hash
      const view =
        h === '#sources' ? 'sources' : h === '#downloads' ? 'downloads' : 'search'
      document.documentElement.dataset.bootView = view
      if (view === 'search') {
        document.getElementById('viewSearch').hidden = false
      }
      document.querySelectorAll('nav a.nav-link[data-view]').forEach((a) => {
        a.classList.toggle('active', a.dataset.view === view)
      })
    })()
  </script>

  <main id="viewSources" class="wrap view-panel view-sources" hidden>
    <section class="import-section">
      <h1>导入音源</h1>
      <div class="card-form">
        <form id="importForm" class="import-form">
          <label>在线导入（脚本 URL）
            <input id="scriptUrl" type="url" placeholder="https://example.com/xxx.js" />
          </label>
          <label>本地导入
            <input id="scriptFile" type="file" accept=".js,text/javascript,text/plain" />
          </label>
          <div class="actions">
            <button type="submit">导入</button>
          </div>
        </form>
      </div>
    </section>

    <section class="sources-list">
      <h2>已导入音源</h2>
      <div class="table-wrap sources-table">
        <table>
          <thead>
            <tr>
              <th class="col-order">顺序</th>
              <th>名称</th>
              <th class="col-version">版本</th>
              <th class="col-author">作者</th>
              <th class="col-status">状态</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="sourceBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    (() => {
      if (document.documentElement.dataset.bootView !== 'sources') return
      document.getElementById('viewSources').hidden = false
      document.body.classList.add('page-sources-active')
    })()
  </script>

  <main id="viewDownloads" class="wrap view-panel view-downloads" hidden>
    <section class="downloads-list">
      <p class="downloads-summary muted" id="downloadSummary">共 0 首</p>
      <div class="table-wrap downloads-table">
        <table>
          <thead>
            <tr>
              <th class="col-file">文件</th>
              <th class="col-size">大小</th>
              <th class="col-time">时间</th>
              <th class="col-actions">操作</th>
            </tr>
          </thead>
          <tbody id="downloadBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    (() => {
      if (document.documentElement.dataset.bootView !== 'downloads') return
      document.getElementById('viewDownloads').hidden = false
      document.body.classList.add('page-downloads-active')
    })()
  </script>

  <div id="dlModal" class="modal" hidden>
    <div class="modal-card">
      <button type="button" class="modal-close" id="dlClose" aria-label="关闭">×</button>
      <div class="modal-title" id="dlTitle">歌曲</div>
      <div class="modal-sub" id="dlArtist">歌手</div>
      <div class="modal-actions" id="dlQualities"></div>
      <p class="modal-status" id="dlStatus"></p>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <aside id="dlQueuePanel" class="dl-queue-panel" hidden>
    <header class="dl-queue-head">
      <strong>下载队列</strong>
      <div class="dl-queue-head-actions">
        <button type="button" id="dlQueueClear" class="ghost small">清除已结束</button>
      </div>
    </header>
    <ul id="dlQueueList" class="dl-queue-list"></ul>
    <p id="dlQueueEmpty" class="dl-queue-empty">暂无任务</p>
  </aside>

  <footer class="player">
    <div class="player-cover-wrap">
      <img id="playerCover" class="player-cover is-logo" src="/img/logo.svg" alt="" />
    </div>
    <div class="player-meta">
      <div id="nowPlaying" class="now-title">未在播放</div>
      <div id="nowArtist" class="now-artist">选择歌曲后点击试听</div>
    </div>
    <button type="button" id="btnPlayPause" class="player-btn" title="播放/暂停" disabled>▶</button>
    <div class="player-progress">
      <span id="timeCurrent" class="time">0:00</span>
      <input id="seekBar" class="seek" type="range" min="0" max="1000" value="0" step="1" disabled />
      <span id="timeTotal" class="time">0:00</span>
    </div>
    <audio id="audio" preload="auto"></audio>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/sources.js"></script>
  <script src="/js/downloads.js"></script>
  <script src="/js/nav.js"></script>
</body>
</html>
